[package]
name = "pockettoolbox-unity-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "pockettoolbox_unity"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
serde_json = "1.0"
unity-rs-core = { git = "https://github.com/seiunx-dev/unity-rs", rev = "30badcbe5f0acef5ee592c5d765d52c5c61f78e6" }

[profile.dev]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
